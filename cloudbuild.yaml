steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/buildgraph/app:$BUILD_ID', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/buildgraph/app:$BUILD_ID']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - buildgraph
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/buildgraph/app:$BUILD_ID'
      - '--region=${_REGION}'
      - '--service-account=buildgraph-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=8'
      - '--timeout=120'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-env-vars=BUILDGRAPH_STORAGE=google,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,BUILDGRAPH_BUCKET=${_BUCKET},BUILDGRAPH_WORKSPACE=demo,BUILDGRAPH_AI_PROVIDER=vertex,GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_VISION_MODEL=${_GEMINI_VISION_MODEL},GOOGLE_CLOUD_LOCATION=global,OPENBLAS_NUM_THREADS=1'
substitutions:
  _REGION: asia-southeast1
  _BUCKET: planchakto-artifacts
  _GEMINI_MODEL: gemini-3.8-flash
  _GEMINI_VISION_MODEL: gemini-3.1-pro-preview
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/buildgraph/app:$BUILD_ID'
options:
  logging: CLOUD_LOGGING_ONLY
